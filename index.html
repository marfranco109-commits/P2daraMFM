<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi experiencia AR con GLB</title>
  <!-- Librerías de A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #aviso {
      position: fixed; top: 12px; left: 12px; right: 12px;
      z-index: 10; padding: 10px; border-radius: 8px;
      background: #153451; color: white;
      font: 16px Arial; text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="aviso">Autoriza la cámara y apunta al target</div>
  
  <a-scene
    mindar-image="imageTargetSrc: ./target3.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target index 0 vinculado a tu archivo target2.mind -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Tu modelo 3D actualizado a modelo.glb -->
      <a-entity 
        gltf-model="./modelo.glb" 
        scale="0.5 0.5 0.5" 
        position="0 0 0" 
        rotation="0 0 0">
      </a-entity>

    </a-entity>
  </a-scene>
</body>
</html>
